<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary SEO -->
  <title>My Blog — Finance, Health, Ayurveda & More</title>
  <meta name="description" content="Read articles on personal finance, GST & accounting, health, Ayurveda, and everyday ideas. Practical guides and thoughts on living well.">
  <meta name="keywords" content="blog, finance, GST, accounting, health, ayurveda, personal finance, budgeting, wellness, articles">
  <meta name="author" content="My Blog">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://yourblog.com/">

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="My Blog">
  <meta property="og:title" content="My Blog — Finance, Health, Ayurveda & More">
  <meta property="og:description" content="Read articles on personal finance, GST & accounting, health, Ayurveda, and everyday ideas.">
  <meta property="og:url" content="https://yourblog.com/">
  <meta property="og:image" content="https://yourblog.com/assets/logo.svg">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="My Blog — Finance, Health, Ayurveda & More">
  <meta name="twitter:description" content="Read articles on personal finance, GST & accounting, health, Ayurveda, and everyday ideas.">
  <meta name="twitter:image" content="https://yourblog.com/assets/logo.svg">

  <!-- PWA / mobile -->
  <meta name="theme-color" content="#1d1d1f">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/logo.svg">

  <!-- Structured data: Blog -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "My Blog",
    "url": "https://yourblog.com/",
    "description": "Articles on personal finance, GST & accounting, health, Ayurveda, and everyday ideas.",
    "publisher": {
      "@type": "Organization",
      "name": "My Blog",
      "logo": { "@type": "ImageObject", "url": "https://yourblog.com/assets/logo.svg" }
    }
  }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="assets/logo.svg" alt="My Blog logo" class="logo-img">
        My Blog
      </a>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="index.html#posts">Posts</a>
        <a href="index.html#about">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <p class="hero-eyebrow">A Blog</p>
      <h1>My Blog</h1>
      <p>Thoughts, tutorials, and notes on web development.</p>
    </section>

    <section id="posts" class="posts" aria-label="Blog posts">
      <div id="category-filters" class="category-filters"><!-- rendered by JS --></div>
      <div id="post-list" class="post-list"><!-- rendered by JS --></div>
    </section>

    <section id="about" class="about">
      <h2>About</h2>
      <p>This is a simple static blog built with plain HTML, CSS, and JavaScript. Add new posts by editing <code>js/posts.js</code>.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 My Blog</p>
    </div>
  </footer>

  <script src="js/posts.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
