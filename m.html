<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Scanner Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- SortableJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0056b3',
                        brandHover: '#004494',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"San Francisco"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        
        .glass-dark {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        /* Video Container Constraints */
        #camera-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 1rem;
            overflow: hidden;
            background-color: #000;
            aspect-ratio: 3/4;
        }

        #camera-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #0056b3;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 3px;
        }

        /* Cropper Adjustments */
        .img-container {
            max-height: 50vh;
            width: 100%;
        }
        
        .cropper-view-box,
        .cropper-face {
            border-radius: 4px;
        }

        /* Gallery Item Hover Effects */
        .gallery-item-actions {
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        .gallery-item:hover .gallery-item-actions {
            opacity: 1;
        }
        @media (max-width: 768px) {
            .gallery-item-actions {
                opacity: 1; /* Always show on mobile */
            }
        }
        
        /* Dragging state for Sortable */
        .sortable-ghost {
            opacity: 0.4;
            background-color: #e2e8f0;
        }
    </style>
</head>
<body class="p-4 md:p-8 font-sans antialiased text-gray-800">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 tracking-tight flex justify-center items-center gap-3">
                <i class="fa-solid fa-file-signature text-brand"></i> DocScanner Pro
            </h1>
            <p class="text-sm text-gray-600 mt-2">Capture, crop, adjust, and generate PDF effortlessly.</p>
        </header>

        <!-- Camera Section -->
        <section class="glass rounded-2xl p-4 md:p-6">
            <div id="camera-container" class="shadow-inner">
                <video id="camera-stream" autoplay playsinline></video>
                <!-- Capture Button Overlay -->
                <button id="btn-capture" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 w-16 h-16 bg-white rounded-full border-4 border-gray-300 shadow-xl flex items-center justify-center hover:scale-105 active:scale-95 transition-transform group">
                    <div class="w-12 h-12 bg-brand rounded-full group-hover:bg-brandHover transition-colors"></div>
                </button>
            </div>
            <div class="text-center mt-4 text-xs text-gray-500" id="camera-status">
                Initializing camera...
            </div>
        </section>

        <!-- Gallery Section (Hidden if empty) -->
        <section id="gallery-section" class="glass rounded-2xl p-4 md:p-6 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold"><i class="fa-solid fa-images mr-2"></i> Scanned Pages</h2>
                <span id="page-count" class="bg-brand text-white px-3 py-1 rounded-full text-xs font-bold">0</span>
            </div>
            
            <p class="text-xs text-gray-500 mb-4"><i class="fa-solid fa-arrows-up-down-left-right mr-1"></i> Drag and drop to reorder pages.</p>
            
            <!-- Grid for images -->
            <div id="gallery" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Images will be injected here -->
            </div>

            <!-- PDF Generation Actions -->
            <div class="mt-8 border-t border-gray-200 pt-6 flex flex-col md:flex-row justify-end gap-3">
                <button id="btn-generate-pdf" class="bg-brand hover:bg-brandHover text-white px-6 py-3 rounded-xl font-medium transition-colors shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-file-pdf"></i> Generate PDF
                </button>
            </div>

            <!-- Output Actions (Hidden initially) -->
            <div id="output-actions" class="mt-6 p-4 bg-green-50 border border-green-200 rounded-xl hidden flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="text-green-700 font-medium flex items-center gap-2">
                    <i class="fa-solid fa-check-circle"></i> PDF Ready!
                </div>
                <div class="flex gap-3 w-full md:w-auto">
                    <button id="btn-download-pdf" class="flex-1 md:flex-none bg-gray-800 hover:bg-gray-900 text-white px-5 py-2.5 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> Download
                    </button>
                    <button id="btn-share-pdf" class="flex-1 md:flex-none bg-blue-100 hover:bg-blue-200 text-brand px-5 py-2.5 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-share-nodes"></i> Share
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center">
        <!-- Backdrop -->
        <div class="absolute inset-0 glass-dark" id="modal-backdrop"></div>
        
        <!-- Modal Content -->
        <div class="relative w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden m-4 flex flex-col max-h-[90vh]">
            <!-- Header -->
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-semibold text-lg">Edit Page</h3>
                <button id="btn-close-modal" class="text-gray-400 hover:text-gray-700 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <!-- Cropper Container -->
            <div class="p-4 bg-gray-100 flex-1 overflow-hidden flex flex-col items-center justify-center">
                <div class="img-container">
                    <img id="image-to-edit" src="" alt="Edit" class="max-w-full block">
                </div>
            </div>
            
            <!-- Adjustments -->
            <div class="p-4 space-y-4 border-t bg-white">
                <div>
                    <div class="flex justify-between text-sm mb-1 text-gray-600">
                        <label for="brightness"><i class="fa-solid fa-sun mr-1"></i> Brightness</label>
                        <span id="brightness-val">100%</span>
                    </div>
                    <input type="range" id="brightness" min="0" max="200" value="100">
                </div>
                <div>
                    <div class="flex justify-between text-sm mb-1 text-gray-600">
                        <label for="contrast"><i class="fa-solid fa-circle-half-stroke mr-1"></i> Contrast</label>
                        <span id="contrast-val">100%</span>
                    </div>
                    <input type="range" id="contrast" min="0" max="200" value="100">
                </div>
            </div>

            <!-- Footer Actions -->
            <div class="p-4 bg-gray-50 border-t flex justify-end gap-3">
                <button id="btn-cancel-edit" class="px-5 py-2 text-gray-600 font-medium hover:bg-gray-200 rounded-lg transition-colors">Cancel</button>
                <button id="btn-save-edit" class="px-5 py-2 bg-brand text-white font-medium hover:bg-brandHover rounded-lg transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden canvas for image processing -->
    <canvas id="processing-canvas" class="hidden"></canvas>

    <script>
        // --- State Management ---
        const state = {
            images: [], // Array of { id, originalSrc, editedSrc, brightness, contrast }
            currentEditingId: null,
            generatedPdfBlob: null
        };

        // --- DOM Elements ---
        const video = document.getElementById('camera-stream');
        const btnCapture = document.getElementById('btn-capture');
        const cameraStatus = document.getElementById('camera-status');
        
        const gallerySection = document.getElementById('gallery-section');
        const gallery = document.getElementById('gallery');
        const pageCount = document.getElementById('page-count');
        
        const btnGeneratePdf = document.getElementById('btn-generate-pdf');
        const outputActions = document.getElementById('output-actions');
        const btnDownloadPdf = document.getElementById('btn-download-pdf');
        const btnSharePdf = document.getElementById('btn-share-pdf');
        
        const editModal = document.getElementById('edit-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const imageToEdit = document.getElementById('image-to-edit');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCancelEdit = document.getElementById('btn-cancel-edit');
        const btnSaveEdit = document.getElementById('btn-save-edit');
        
        const sliderBrightness = document.getElementById('brightness');
        const sliderContrast = document.getElementById('contrast');
        const valBrightness = document.getElementById('brightness-val');
        const valContrast = document.getElementById('contrast-val');
        
        const processingCanvas = document.getElementById('processing-canvas');
        const processingCtx = processingCanvas.getContext('2d');

        let cropper = null;

        // --- STREAMING_CHUNK:Implementing Camera Functionality ---
        async function initCamera() {
            try {
                // Request environment facing camera with continuous auto-focus if available
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        advanced: [{ focusMode: 'continuous' }]
                    },
                    audio: false
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                cameraStatus.innerHTML = '<span class="text-green-600"><i class="fa-solid fa-circle-check"></i> Camera ready</span>';
            } catch (err) {
                console.error("Camera error:", err);
                // Fallback to basic video constraint if advanced fails
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    video.srcObject = fallbackStream;
                    cameraStatus.innerHTML = '<span class="text-green-600"><i class="fa-solid fa-circle-check"></i> Camera ready (Fallback mode)</span>';
                } catch (fallbackErr) {
                    cameraStatus.innerHTML = '<span class="text-red-600"><i class="fa-solid fa-triangle-exclamation"></i> Camera access denied or not found.</span>';
                }
            }
        }

        btnCapture.addEventListener('click', () => {
            if (!video.videoWidth) return; // Ensure video is playing

            // Set canvas to match video dimensions
            processingCanvas.width = video.videoWidth;
            processingCanvas.height = video.videoHeight;
            
            // Draw current frame
            processingCtx.drawImage(video, 0, 0, processingCanvas.width, processingCanvas.height);
            
            // Get data URL
            const dataUrl = processingCanvas.toDataURL('image/jpeg', 0.9);
            
            // Add to state
            const newImage = {
                id: 'img_' + Date.now(),
                originalSrc: dataUrl,
                editedSrc: dataUrl, // Initially identical
                brightness: 100,
                contrast: 100
            };
            
            state.images.push(newImage);
            
            // Hide output actions since we modified the document
            outputActions.classList.add('hidden');
            
            updateGallery();
            
            // Visual feedback on capture button
            btnCapture.classList.add('ring-4', 'ring-brand', 'ring-opacity-50');
            setTimeout(() => btnCapture.classList.remove('ring-4', 'ring-brand', 'ring-opacity-50'), 200);
        });

        // --- STREAMING_CHUNK:Implementing Gallery & Drag/Drop ---
        function updateGallery() {
            gallery.innerHTML = '';
            pageCount.textContent = state.images.length;
            
            if (state.images.length > 0) {
                gallerySection.classList.remove('hidden');
            } else {
                gallerySection.classList.add('hidden');
                return;
            }

            state.images.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item relative aspect-[3/4] bg-gray-200 rounded-lg overflow-hidden shadow-sm border border-gray-300 cursor-move group';
                item.dataset.id = img.id;
                
                // Page Number Badge
                const badge = document.createElement('div');
                badge.className = 'absolute top-2 left-2 bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm z-10';
                badge.textContent = index + 1;
                
                // Image Element
                const imgEl = document.createElement('img');
                imgEl.src = img.editedSrc;
                imgEl.className = 'w-full h-full object-cover';
                
                // Actions Overlay
                const actions = document.createElement('div');
                actions.className = 'gallery-item-actions absolute inset-0 bg-black/40 flex items-center justify-center gap-3 backdrop-blur-[2px] transition-opacity z-20';
                
                const btnEdit = document.createElement('button');
                btnEdit.innerHTML = '<i class="fa-solid fa-crop-simple"></i>';
                btnEdit.className = 'w-10 h-10 bg-white text-gray-800 rounded-full shadow hover:bg-brand hover:text-white transition-colors flex items-center justify-center';
                btnEdit.onclick = (e) => {
                    e.stopPropagation();
                    openEditModal(img.id);
                };
                
                const btnDelete = document.createElement('button');
                btnDelete.innerHTML = '<i class="fa-solid fa-trash"></i>';
                btnDelete.className = 'w-10 h-10 bg-white text-red-600 rounded-full shadow hover:bg-red-600 hover:text-white transition-colors flex items-center justify-center';
                btnDelete.onclick = (e) => {
                    e.stopPropagation();
                    deleteImage(img.id);
                };
                
                actions.appendChild(btnEdit);
                actions.appendChild(btnDelete);
                
                item.appendChild(badge);
                item.appendChild(imgEl);
                item.appendChild(actions);
                
                gallery.appendChild(item);
            });
        }

        function deleteImage(id) {
            state.images = state.images.filter(img => img.id !== id);
            outputActions.classList.add('hidden'); // PDF needs regeneration
            updateGallery();
        }

        // Initialize SortableJS on the gallery
        new Sortable(gallery, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function () {
                // Reconstruct state array based on new DOM order
                const newOrderIds = Array.from(gallery.children).map(el => el.dataset.id);
                state.images = newOrderIds.map(id => state.images.find(img => img.id === id));
                outputActions.classList.add('hidden'); // PDF needs regeneration
                updateGallery(); // Re-render to update page number badges
            }
        });

        // --- STREAMING_CHUNK:Implementing Cropper & Image Adjustments ---
        function openEditModal(id) {
            const imgData = state.images.find(img => img.id === id);
            if (!imgData) return;
            
            state.currentEditingId = id;
            
            // Set image source for cropper (always work from original source for max quality)
            imageToEdit.src = imgData.originalSrc;
            
            // Reset Sliders to stored values
            sliderBrightness.value = imgData.brightness;
            sliderContrast.value = imgData.contrast;
            updateSliderLabels();

            editModal.classList.remove('hidden');
            editModal.classList.add('flex');
            
            // Initialize Cropper (must wait for image to load/be visible)
            setTimeout(() => {
                if (cropper) cropper.destroy();
                cropper = new Cropper(imageToEdit, {
                    viewMode: 2, // restrict crop box to not exceed size of canvas
                    dragMode: 'move',
                    autoCropArea: 1,
                    restore: false,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                    ready: function() {
                        applyFiltersToPreview();
                    }
                });
            }, 100);
        }

        function closeEditModal() {
            editModal.classList.add('hidden');
            editModal.classList.remove('flex');
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            state.currentEditingId = null;
        }

        function updateSliderLabels() {
            valBrightness.textContent = `${sliderBrightness.value}%`;
            valContrast.textContent = `${sliderContrast.value}%`;
        }

        function applyFiltersToPreview() {
            if (!cropper) return;
            // Apply CSS filter to the cropper viewing box to preview adjustments live
            const viewBoxImage = document.querySelector('.cropper-view-box img');
            if (viewBoxImage) {
                viewBoxImage.style.filter = `brightness(${sliderBrightness.value}%) contrast(${sliderContrast.value}%)`;
            }
        }

        // Event Listeners for Edit Modal
        [btnCloseModal, btnCancelEdit, modalBackdrop].forEach(btn => {
            btn.addEventListener('click', closeEditModal);
        });

        sliderBrightness.addEventListener('input', () => {
            updateSliderLabels();
            applyFiltersToPreview();
        });
        
        sliderContrast.addEventListener('input', () => {
            updateSliderLabels();
            applyFiltersToPreview();
        });

        btnSaveEdit.addEventListener('click', () => {
            if (!cropper || !state.currentEditingId) return;

            const imgIndex = state.images.findIndex(img => img.id === state.currentEditingId);
            if (imgIndex === -1) return;

            // 1. Get Cropped Canvas
            const croppedCanvas = cropper.getCroppedCanvas({
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            // 2. Create offscreen canvas to apply filters
            processingCanvas.width = croppedCanvas.width;
            processingCanvas.height = croppedCanvas.height;
            
            // Clear context and set filter
            processingCtx.clearRect(0, 0, processingCanvas.width, processingCanvas.height);
            processingCtx.filter = `brightness(${sliderBrightness.value}%) contrast(${sliderContrast.value}%)`;
            
            // Draw cropped image onto processing canvas
            processingCtx.drawImage(croppedCanvas, 0, 0);
            
            // 3. Extract final data URL and update state
            const finalDataUrl = processingCanvas.toDataURL('image/jpeg', 0.9);
            
            state.images[imgIndex].editedSrc = finalDataUrl;
            state.images[imgIndex].brightness = parseInt(sliderBrightness.value);
            state.images[imgIndex].contrast = parseInt(sliderContrast.value);

            outputActions.classList.add('hidden'); // PDF needs regeneration
            updateGallery();
            closeEditModal();
        });

        // --- STREAMING_CHUNK:Implementing PDF Generation & Sharing ---
        btnGeneratePdf.addEventListener('click', async () => {
            if (state.images.length === 0) {
                alert("Please scan at least one page to generate a PDF.");
                return;
            }

            // Visual feedback loading
            const originalBtnHtml = btnGeneratePdf.innerHTML;
            btnGeneratePdf.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            btnGeneratePdf.disabled = true;

            try {
                const { jsPDF } = window.jspdf;
                // Create A4 PDF (210mm x 297mm)
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                // Process images sequentially
                for (let i = 0; i < state.images.length; i++) {
                    const imgObj = state.images[i];
                    
                    if (i > 0) {
                        pdf.addPage();
                    }

                    // To calculate proper aspect ratio, we need to load the image
                    await new Promise((resolve, reject) => {
                        const img = new Image();
                        img.onload = () => {
                            const imgRatio = img.width / img.height;
                            const pageRatio = pageWidth / pageHeight;
                            
                            let renderWidth = pageWidth;
                            let renderHeight = pageHeight;
                            let x = 0;
                            let y = 0;

                            // Scale to fit while maintaining aspect ratio
                            if (imgRatio > pageRatio) {
                                // Image is wider than page aspect
                                renderHeight = pageWidth / imgRatio;
                                y = (pageHeight - renderHeight) / 2; // Center vertically
                            } else {
                                // Image is taller than page aspect
                                renderWidth = pageHeight * imgRatio;
                                x = (pageWidth - renderWidth) / 2; // Center horizontally
                            }

                            // Add to PDF (using 'JPEG' for better compression if possible)
                            pdf.addImage(imgObj.editedSrc, 'JPEG', x, y, renderWidth, renderHeight, undefined, 'FAST');
                            resolve();
                        };
                        img.onerror = reject;
                        img.src = imgObj.editedSrc;
                    });
                }

                // Generate Blob
                state.generatedPdfBlob = pdf.output('blob');
                
                // Show Output Actions
                outputActions.classList.remove('hidden');
                
                // Check if Web Share API is available for files
                if (!(navigator.canShare && navigator.canShare({ files: [new File([new Blob()], 't.pdf')] }))) {
                    btnSharePdf.classList.add('hidden');
                } else {
                    btnSharePdf.classList.remove('hidden');
                }

            } catch (error) {
                console.error("Error generating PDF:", error);
                alert("An error occurred while generating the PDF.");
            } finally {
                btnGeneratePdf.innerHTML = originalBtnHtml;
                btnGeneratePdf.disabled = false;
            }
        });

        // Download Action
        btnDownloadPdf.addEventListener('click', () => {
            if (!state.generatedPdfBlob) return;
            const url = URL.createObjectURL(state.generatedPdfBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Document_Scan_${new Date().toISOString().slice(0,10)}.pdf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Share Action
        btnSharePdf.addEventListener('click', async () => {
            if (!state.generatedPdfBlob) return;
            
            const file = new File([state.generatedPdfBlob], `Scanned_Doc_${Date.now()}.pdf`, { type: 'application/pdf' });
            
            try {
                await navigator.share({
                    title: 'Scanned Document',
                    text: 'Here is my scanned document.',
                    files: [file]
                });
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error("Error sharing:", err);
                    alert("Sharing failed or is not supported on this browser/device.");
                }
            }
        });

        // --- Initialization ---
        window.onload = () => {
            initCamera();
            updateGallery();
        };

    </script>
</body>
</html>
