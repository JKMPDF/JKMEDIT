<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sangeet Night | Priyanka & Abhishek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --s-purple: #4B0082;
            --s-pink: #FF1493;
            --cream: #FFFDF5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { background: #000; font-family: 'Poppins', sans-serif; overflow: hidden; display: flex; justify-content: center; }

        .container {
            width: 100vw; max-width: 500px; height: 100vh;
            background: var(--cream) url('assets/page5a.jpg') center/cover no-repeat;
            position: relative; display: flex; flex-direction: column; align-items: center; overflow: hidden;
        }

        .event-card {
            position: relative; z-index: 5; margin: 150px 20px 80px 20px;
            background: transparent;
            padding: 0px 20px;
            text-align: center;
            width: calc(100% - 40px);
        }

        .title { font-family: 'Cinzel', serif; color: var(--s-purple); font-size: 1.8rem; letter-spacing: 3px; }
        .sub-title { font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: #b32d29; margin: 5px 0; }
        .info-box { padding: 10px 0; margin: 15px 0; }

        .timer-wrap { display: flex; justify-content: center; gap: 8px; margin: 15px 0; }
        .unit { background: var(--s-purple); color: white; min-width: 50px; padding: 5px; border-radius: 8px; }
        .unit span { display: block; font-weight: 600; font-size: 1.1rem; font-family: 'Cinzel'; }
        .unit label { font-size: 0.5rem; text-transform: uppercase; }

        .btn-cal {
            background: var(--s-purple); color: white; padding: 12px 25px; border-radius: 30px;
            text-decoration: none; font-size: 0.8rem; display: inline-block; margin-top: 20px;
            font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="event-card">
        <p style="font-size: 0.7rem; letter-spacing: 3px; font-weight: bold; color: #555;">MUSICAL NIGHT</p>
        <h1 class="title">SANGEET</h1>
        <p class="sub-title">Dance, Music & Masti</p>

        <div class="info-box">
            <p style="font-family: 'Cinzel'; font-weight: bold;">29 NOVEMBER 2026</p>
            <p style="color: #b32d29; font-weight: 600;">Evening 05:00 PM Onwards</p>
        </div>

        <div class="timer-wrap" id="timer">
            <div class="unit"><span id="d">00</span><label>Days</label></div>
            <div class="unit"><span id="h">00</span><label>Hrs</label></div>
            <div class="unit"><span id="m">00</span><label>Min</label></div>
            <div class="unit"><span id="s">00</span><label>Sec</label></div>
        </div>

        <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Sangeet+Night+|Yadav parivar&dates=20261129T113000Z/20261129T153000Z&details=Join+us+for+the+Sangeet+celebration.&location=Pratapganj+Bajar+UP"
           target="_blank" class="btn-cal">
            📅 SAVE THE DATE
        </a>

        <div style="margin-top: 25px;">
            <p style="font-size: 0.6rem; letter-spacing: 2px; font-weight: bold; color: #777;">VENUE</p>
            <p style="font-size: 0.9rem; color: var(--s-purple); font-weight: 600;">Pratapganj Bajar UP</p>
        </div>
    </div>
</div>

<script>
    const target = new Date("November 29, 2026 17:00:00").getTime();

    function update() {
        const now = new Date().getTime();
        const gap = target - now;

        if (gap < 0) {
            document.getElementById('timer').innerHTML = "<b>EVENT STARTED</b>";
            return;
        }

        const d = Math.floor(gap / 86400000);
        const h = Math.floor((gap % 86400000) / 3600000);
        const m = Math.floor((gap % 3600000) / 60000);
        const s = Math.floor((gap % 60000) / 1000);

        document.getElementById('d').innerText = d.toString().padStart(2, '0');
        document.getElementById('h').innerText = h.toString().padStart(2, '0');
        document.getElementById('m').innerText = m.toString().padStart(2, '0');
        document.getElementById('s').innerText = s.toString().padStart(2, '0');
    }

    setInterval(update, 1000);
    update();
</script>

</body>
</html>
